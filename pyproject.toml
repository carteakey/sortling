[project]
name = "sortling"
version = "0.2.0"
description = "Tidy screenshots, downloads and documents with decision models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sortling = "sortling:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sortling"]
